#The name of your workflow.
name: build
# Trigger the workflow on push or pull request
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
#A workflow run is made up of one or more jobs. Jobs run in parallel by default.
jobs:
  test:
    #The type of machine to run the job on. [windows,macos, ubuntu , self-hosted]
    defaults:
      run:
        working-directory: ./
    runs-on: ubuntu-latest
    #sequence of tasks called
    steps:
      # The branch or tag ref that triggered the workflow will be checked out.
      # https://github.com/actions/checkout
      - uses: actions/checkout@v4
      # Setup a flutter environment.
      # https://github.com/marketplace/actions/flutter-action
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      #- run: flutter analyze
      # run  flutter widgets tests  and unit tests
      - run: flutter test --coverage
      # Upload coverage reports to Codecov
      # https://github.com/marketplace/actions/codecov
      - uses: codecov/codecov-action@v4

  # Builds the example app for web and deploys it to the gh-pages branch.
  # Only runs after `test` passes, and only for pushes to master — pull
  # requests build and test above but never deploy.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href matches this repo's GitHub Pages URL
      # (https://<owner>.github.io/high_chart/) — update it to match if the
      # Pages site ever moves.
      - run: |
          flutter build web --release \
            --base-href /high_chart/ \
            --source-maps \
            --dart-define="commit=${{ steps.vars.outputs.sha_short }}"

      - name: Write version.json
        run: |
          cat > build/web/version.json <<EOF
          {
            "buildTime": "${{ steps.vars.outputs.build_time }}",
            "commit": "${{ steps.vars.outputs.sha_short }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      # Deploys by committing build/web's contents as the root of gh-pages
      # and force-pushing — no explicit token needed, actions/checkout
      # already persisted push credentials for `origin` above.
      - run: git config user.name github-actions
      - run: git config user.email github-actions@github.com
      - run: git --work-tree build/web add --all
      - run: git commit -m "Automatic deployment by github-actions"
      - run: git push origin HEAD:gh-pages --force
