name: high_chart
description: "A chart library based on High Charts (.JS), able to build advanced charts like Pie chart, linear chart, etc."
version: 2.7.0
homepage: https://github.com/senthilnasa/high_chart


environment:
  sdk: ^3.5.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  webview_windows: ^0.4.0
  path_provider: ^2.1.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1
  path_provider_platform_interface: ^2.1.3


flutter:
 
  plugin:
    platforms:
      android:
        package: me.senthilnasa.high_chart
        pluginClass: HighChartPlugin
      ios:
        pluginClass: HighChartPlugin
      linux:
        pluginClass: HighChartPlugin
      macos:
        pluginClass: HighChartPlugin
      windows:
        pluginClass: HighChartPluginCApi
      web:
        pluginClass: HighChartPlatformInterface
        fileName: high_chart_web.dart