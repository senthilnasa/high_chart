name: generate_options
description: >
  Generates lib/src/options/*.dart from Highcharts' own TypeScript
  definitions. Standalone dev tool, not part of the high_chart package
  itself — see README.md for how to run it.
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
